<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PokRecycling – Heróis da Comunidade · Vila Esperança</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14201a;
    font-family: "Pixelify Sans", ui-monospace, monospace; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas#g { display: block; width: 100vw; height: 100vh; }

  #hud { position: fixed; top: 10px; left: 10px; color: #fff8e1; background: rgba(12,28,18,.6);
    padding: 6px 12px; border-radius: 8px; font-size: 13px; line-height: 1.4; pointer-events: none; }

  .joy { position: fixed; left: 20px; bottom: 20px; width: 150px; height: 150px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.4);
    background: radial-gradient(circle, rgba(255,255,255,.2) 0%, rgba(255,255,255,.08) 70%);
    display: flex; align-items: center; justify-content: center; touch-action: none; }
  .knob { width: 62px; height: 62px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 35% 30%, #fff 0%, #cfd8dc 60%, #90a4ae 100%);
    box-shadow: 0 4px 10px rgba(0,0,0,.4); transition: transform .12s ease-out; }
  .knob.active { transition: none; }

  #goal { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); max-width: min(560px, 92vw);
    padding: 8px 16px; border-radius: 10px; background: rgba(12,28,18,.88); color: #fff8e1;
    border: 2px solid #ffd54f; font-size: 15px; text-align: center; pointer-events: none; z-index: 2; display: none; }
  #goal.warn { background: rgba(170,30,30,.94); border-color: #ff8a80; color: #fff; }
  @media (max-width: 700px) { #goal { top: 100px; } }
  .btn { position: fixed; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); color: #fff;
    font: 700 22px "Pixelify Sans", sans-serif; display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent; }
  #bA { right: 22px; bottom: 36px; width: 78px; height: 78px; background: rgba(230,70,70,.55); }
  #bE { right: 40px; bottom: 124px; width: 56px; height: 56px; background: rgba(255,213,79,.55); color: #2b2a22; }
  .mini { position:fixed; right:18px; bottom:220px; min-width:48px; height:42px; padding:0 10px; border:2px solid #fff9; border-radius:10px; background:#173c2ddd; color:#fff; font:700 15px "Pixelify Sans",monospace; z-index:3; }
  #bI { right:74px; }
  @media (min-width:701px) { .mini { opacity:.82; } }

  .ov { position: fixed; inset: 0; background: rgba(8,16,12,.72); display: none;
    align-items: center; justify-content: center; padding: 14px; z-index: 5; }
  .ov.on { display: flex; }
  #menu { overflow: hidden; background:
    radial-gradient(circle at 80% 18%, #ffffff55 0 1px, transparent 2px),
    radial-gradient(circle at 30% 10%, #ffffff66 0 1px, transparent 2px),
    radial-gradient(circle at 60% 6%, #ffffff44 0 1px, transparent 2px),
    linear-gradient(#0b1733, #23325e 65%, #2f2b46); }
  #menu::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 120px;
    background: repeating-linear-gradient(90deg, #0a0f1f 0 34px, #141d36 34px 40px, #0a0f1f 40px 58px, transparent 58px 66px);
    clip-path: polygon(0 100%, 0 45%, 8% 45%, 8% 20%, 16% 20%, 16% 60%, 26% 60%, 26% 30%, 36% 30%, 36% 55%, 48% 55%, 48% 15%, 58% 15%, 58% 50%, 70% 50%, 70% 25%, 82% 25%, 82% 60%, 92% 60%, 92% 35%, 100% 35%, 100% 100%); }
  .box { background: #fdf6e3; color: #2b2a22; border: 4px solid #3b2f1e; border-radius: 14px;
    box-shadow: 0 8px 0 #3b2f1e; width: min(760px, 100%); max-height: 92vh; overflow: auto;
    padding: 18px; font-size: calc(16px * var(--fs, 1)); line-height: 1.45; }
  .box h2 { margin: 4px 0 10px; font-size: 24px; }
  .box h3 { margin: 16px 0 6px; font-size: 18px; }
  .box p { margin: 6px 0; }
  .box button { font: inherit; font-weight: 700; background: #2f6fd6; color: #fff; border: 0;
    border-bottom: 4px solid #1d4a95; border-radius: 8px; padding: 9px 14px; margin: 4px 4px 4px 0; cursor: pointer; }
  .box button:active { transform: translateY(2px); }
  .box button.ghost { background: #eee; color: #333; border-bottom-color: #999; }
  .nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .nav button { background: #e9e0c8; color: #3b2f1e; border-bottom-color: #a89a7a; font-size: 14px; }
  .nav button.on { background: #2f6fd6; color: #fff; border-bottom-color: #1d4a95; }
  .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 12px; }
  .opts { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
  .opts button { text-align: left; background: #fff; color: #2b2a22; border: 2px solid #3b2f1e; border-bottom-width: 4px; }
  textarea { width: 100%; min-height: 70px; font: inherit; padding: 8px; border-radius: 8px; border: 2px solid #999; }
  .mis { background: #fff; border-radius: 10px; padding: 10px 12px; margin: 8px 0; box-shadow: 0 3px 0 #d6cdb4; }
  .mis.lock { filter: grayscale(1); opacity: .7; }
  .mis em { font-style: normal; font-size: 14px; color: #6b5a3a; margin-left: 6px; }
  .cmd { display: flex; gap: 12px; align-items: center; padding: 6px 0; border-bottom: 1px dashed #bbb; }
  .cmd > span:first-child { min-width: 170px; }
  kbd { display: inline-block; min-width: 34px; padding: 3px 8px; border: 2px solid #555; border-bottom-width: 5px;
    border-radius: 6px; background: #fff; text-align: center; font: inherit; margin: 2px; }
  .card { border-left: 10px solid var(--c); background: #fff; border-radius: 10px; padding: 12px;
    margin: 8px 0; box-shadow: 0 3px 0 #d6cdb4; }
  .cb { display: flex; gap: 12px; align-items: center; }
  .cb h3 { margin: 0; font-size: 18px; }
  .cb small { font-size: 13px; color: #6b5a3a; }
  .num { flex: none; width: 52px; height: 52px; border-radius: 10px; background: var(--c); color: #fff;
    font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .cbody p { font-size: 15px; margin: 6px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .odsc { background: #fff; border-left: 8px solid var(--c); border-radius: 10px; padding: 10px;
    display: flex; gap: 10px; align-items: center; }
  .odsc .num { width: 42px; height: 42px; font-size: 19px; }
  .odsc.lock { opacity: .45; }
  .bar { height: 14px; background: #ddd; border-radius: 7px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #4caf50; }
  .ba { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
  .ba > div { padding: 10px; border-radius: 10px; }
  .before { background: #cfc8b6; } .after { background: #bfe8a8; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 10px 0; }
  .final { font-style: italic; background: #fff; padding: 12px; border-radius: 10px; border-left: 6px solid #f0a22e; }
  .medals span { display: inline-block; background: #fff; border-radius: 8px; padding: 4px 8px; margin: 3px; }
  .lockmsg { color: #6b5a3a; }
  .opts button.sel { background: #cfe3ff; border-color: #2f6fd6; }
  .calm .knob { transition: none; } .calm * { animation: none !important; }
  .pc #joy, .pc #bA, .pc #bE { display: none; }
  @media (max-width: 520px) { .ba, .stats { grid-template-columns: 1fr; } .cmd { flex-direction: column; align-items: flex-start; } }
  #bflash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 9; }
  #bflash.on { animation: bfl .95s steps(1) forwards; }
  @keyframes bfl { 0%{opacity:0} 15%{opacity:1} 30%{opacity:0} 45%{opacity:1} 60%{opacity:0} 75%{opacity:1} 100%{opacity:0} }
  #bt { position: fixed; inset: 0; background: #9fd8ff; display: none; flex-direction: column;
    justify-content: space-between; padding: 12px; z-index: 8; color: #2b2a22; }
  .bside { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .bspr { position: relative; font-size: 76px; line-height: 1; }
  .bspr::after { content: ''; position: absolute; left: -12%; right: -12%; bottom: -10px; height: 26px; background: #a6e07a; border: 3px solid #2e7d32; border-radius: 50%; box-shadow: inset 0 -6px 0 #7fc24f; z-index: -1; }
  #bbg { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; z-index: -2; }
  #bpc { width: 120px; height: 102px; image-rendering: pixelated; display: block; }
  #bpe { font-size: 76px; }
  #bec { width: 96px; height: 96px; image-rendering: pixelated; display: block; }
  .bcard { background: #fdf6e3; border: 3px solid #3b2f1e; border-radius: 10px; padding: 8px 10px; min-width: 160px; }
  .bbar { height: 10px; background: #bbb; border-radius: 5px; overflow: hidden; margin-top: 5px; }
  .bbar i { display: block; height: 100%; width: 100%; background: #4caf50; transition: width .4s; }
  .bbox { background: #fdf6e3; border: 3px solid #3b2f1e; border-radius: 10px; padding: 10px; }
  .bbox p { margin: 0 0 8px; min-height: 44px; }
  #bcm { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #bcm button { font: inherit; font-weight: 700; background: #2f6fd6; color: #fff; border: 0; border-bottom: 4px solid #1d4a95; border-radius: 8px; padding: 10px; }
  .bhit { animation: bsk .3s; }
  @keyframes bsk { 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }
  @media (prefers-reduced-motion: reduce) { #bflash.on, .bhit { animation: none; } }
  .bimp { position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; pointer-events: none; z-index: 3;
    background: radial-gradient(circle, #fff 0 25%, #ffd54f 26% 55%, rgba(255,87,34,0) 56%); animation: bimp .4s ease-out forwards; }
  @keyframes bimp { 0% { transform: scale(.3); opacity: 1; } 100% { transform: scale(5); opacity: 0; } }
  .bnum { position: absolute; left: 50%; top: 5%; font: 700 24px "Pixelify Sans", monospace; color: #fff; text-shadow: 2px 2px 0 #000; pointer-events: none; z-index: 4; white-space: nowrap; animation: bnum .9s ease-out forwards; }
  @keyframes bnum { 0% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -40px); } }
  .bshake { animation: bsh .3s; }
  @keyframes bsh { 25% { transform: translate(-6px, 3px); } 50% { transform: translate(6px, -3px); } 75% { transform: translate(-4px, 2px); } }
  @media (prefers-reduced-motion: reduce) { .bimp { display: none; } .bnum, .bshake { animation: none; } }
</style>
</head>
<body>
<canvas id="g"></canvas>

<div id="hud">
  <b>POKRECYCLING – HERÓIS DA COMUNIDADE</b><br>Vila Esperança<br>
  Setas/WASD ou joystick: andar · Espaço: falar<br>
  E: examinar · M: mapa · I: inventário · P: PokRecycling · J: missões · Esc: menu
</div>

<div id="goal"></div>
<div class="joy" id="joy" role="application" aria-label="Joystick de movimento">
  <div class="knob" id="knob"></div>
</div>
<button class="btn" id="bE" aria-label="Examinar">E</button>
<button class="btn" id="bA" aria-label="Falar">A</button>
<button class="mini" id="bM" aria-label="Abrir mapa">MAPA</button><button class="mini" id="bI" aria-label="Abrir inventário">ITENS</button>

<div class="ov" id="menu">
  <div class="box">
    <div class="nav"></div>
    <div id="pane"></div>
    <p style="text-align:right"><button class="ghost" id="mclose">Fechar</button></p>
  </div>
</div>
<div class="ov" id="modal"></div>
<div id="bt">
  <canvas id="bbg"></canvas><div class="bside"><div class="bcard"><b id="ben"></b><div class="bbar"><i id="beh"></i></div></div><div class="bspr" id="bes"><canvas id="bec" width="16" height="16"></canvas></div></div>
  <div class="bside"><div class="bspr" id="bps"><canvas id="bpc" width="20" height="17"></canvas><span id="bpe"></span></div><div class="bcard"><b id="bpn"></b> <span id="bpv"></span><div class="bbar"><i id="bph"></i></div></div></div>
  <div class="bbox"><p id="bm"></p><div id="bcm"></div></div>
</div>
<div id="bflash"></div>

<script>
(() => {
  const TS = 40, COLS = 40, ROWS = 30, STEP_MS = 170;
  const KEY = 'vila-verde-ods-v2';
  const SOLID = new Set(['T', 'H', 'W', 'F', 'R', 'M', 'r', 'K']);
  const OBJ = new Set(['T', 'H', 'D']);
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const cv = $('g'), ctx = cv.getContext('2d');
  let VW, VH;
  function resize() { VW = cv.width = innerWidth; VH = cv.height = innerHeight; ctx.imageSmoothingEnabled = false; }
  addEventListener('resize', resize); resize();

  // ---------- Conteúdo educativo ----------
  const PH = [
    { n: 'Bairro Limpo', prob: 'Lixo acumulado, falta de lixeiras e poluição.', mis: 'Organizar uma campanha de limpeza e conscientização.', ods: [11, 12], medal: 'Medalha Verde', item: 'Sacola reutilizável',
      sol: [['Organizar uma campanha de limpeza e conscientização com os moradores', 'b'], ['Instalar lixeiras em uma só rua, sem consultar ninguém', 'm'], ['Ignorar o problema, porque o lixo não é da comunidade', 'r']] },
    { n: 'Escola para Todos', prob: 'Bullying, falta de acessibilidade e dificuldades de convivência.', mis: 'Promover respeito, inclusão e melhorias no ambiente escolar.', ods: [4, 10], medal: 'Medalha Amizade', item: 'Caderno de ideias',
      sol: [['Criar rodas de conversa sobre respeito e instalar uma rampa de acesso', 'b'], ['Organizar um mural de cartazes sobre respeito na escola', 'm'], ['Separar os alunos por turmas nos intervalos', 'r']] },
    { n: 'Ruas Mais Seguras', prob: 'Iluminação precária, calçadas danificadas e falta de sinalização.', mis: 'Identificar os problemas e apresentar propostas de melhoria.', ods: [11, 16], medal: 'Medalha Farol', item: 'Lanterna solar',
      sol: [['Mapear os problemas e levar uma proposta à prefeitura', 'b'], ['Avisar apenas os vizinhos da própria rua', 'm'], ['Pintar as calçadas sozinho, sem autorização', 'r']] },
    { n: 'Comunidade Solidária', prob: 'Falta de integração e apoio entre moradores.', mis: 'Organizar ações solidárias e incentivar a participação comunitária.', ods: [1, 10, 17], medal: 'Medalha Mãos Dadas', item: 'Cesta solidária',
      sol: [['Organizar mutirões de apoio, visitas aos vizinhos e cestas solidárias', 'b'], ['Ajudar apenas os amigos mais próximos', 'm'], ['Deixar as ações para depois', 'r']] },
    { n: 'Natureza Protegida', prob: 'Poluição dos rios, desmatamento e falta de áreas verdes.', mis: 'Proteger os recursos naturais e conscientizar os moradores.', ods: [6, 13, 15], medal: 'Medalha Rio Vivo', item: 'Kit de mudas',
      sol: [['Plantar mudas, limpar as margens do rio e conscientizar a comunidade', 'b'], ['Limpar só a margem da própria casa', 'm'], ['Jogar lixo no rio para facilitar a limpeza', 'r']] }
  ];
  const PARTNERS = { 0: ['Brotinho 🌱', 'Brilho verde'], 1: ['Gotalis 💧', 'Jato de limpeza'], 2: ['Coraçon ❤️', 'Abraço amigo'], 3: ['Voltinho ⚡', 'Luz amiga'], 4: ['Amizel 🤝', 'União'], 5: ['Uranix 🔮', 'Purificar'] };
  const QOPTS = ['Participar de um mutirão de limpeza ou de uma ação comunitária', 'Propor melhorias à prefeitura por meio de um abaixo-assinado', 'Conscientizar vizinhos e colegas com cartazes ou conversas'];

  // ODS: [nome, cor oficial, objetivo, como aparece no jogo, na vida real, curiosidade]
  const ODS = {
    1: ['Erradicação da Pobreza', '#E5243B', 'Acabar com a pobreza em todas as suas formas, em todos os lugares.', 'Ao organizar cestas e apoio às famílias, o jogador combate a falta de alimentos no bairro.', 'Doe alimentos, ajude um vizinho a conhecer programas sociais e divulgue campanhas solidárias.', 'A ONU considera a erradicação da pobreza o primeiro dos 17 objetivos da Agenda 2030.'],
    4: ['Educação de Qualidade', '#C5192D', 'Garantir educação inclusiva, equitativa e de qualidade para todos.', 'Rodas de conversa e uma escola acessível ajudam todos os alunos a aprender e conviver.', 'Respeite os colegas, combata o bullying e apoie quem tem mais dificuldade nos estudos.', 'A educação de qualidade é um dos objetivos centrais da Agenda 2030 da ONU.'],
    6: ['Água Potável e Saneamento', '#26BDE2', 'Garantir disponibilidade e manejo sustentável da água e do saneamento para todos.', 'Limpar as margens do rio e combater a poluição protege a água da vila.', 'Não jogue lixo ou óleo na pia nem no chão; economize água no dia a dia.', 'A ONU reconhece o acesso à água potável e ao saneamento como direitos humanos.'],
    10: ['Redução das Desigualdades', '#DD1367', 'Reduzir as desigualdades dentro dos países e entre eles.', 'Ajudar vizinhos isolados e incluir todas as turmas mostra que ninguém deve ficar para trás.', 'Participe de ações que incluam pessoas com deficiência, idosos e famílias em situação de risco.', 'O objetivo 10 trata de inclusão social, econômica e política.'],
    11: ['Cidades e Comunidades Sustentáveis', '#FD9D24', 'Tornar as cidades e comunidades mais inclusivas, seguras, resilientes e sustentáveis.', 'Ao limpar o bairro, cuidar das praças e melhorar os espaços públicos, o jogador contribui para uma cidade melhor.', 'Descarte o lixo corretamente, preserve os espaços públicos e participe de iniciativas comunitárias.', 'Segundo a ONU, mais da metade da população mundial vive hoje em cidades.'],
    12: ['Consumo e Produção Responsáveis', '#BF8B2E', 'Assegurar padrões de consumo e produção sustentáveis.', 'Coleta seletiva e campanhas contra o desperdício reduzem o lixo acumulado e a poluição.', 'Separe o lixo reciclável, reduza embalagens descartáveis e prefira produtos duráveis.', 'Reciclar latas de alumínio economiza muito mais energia do que produzir alumínio novo.'],
    13: ['Ação Contra a Mudança Global do Clima', '#3F7E44', 'Tomar medidas urgentes para combater a mudança do clima e seus impactos.', 'Plantar mudas e preservar áreas verdes ajuda a reduzir o calor e a poluição do ar.', 'Economize energia, use transporte coletivo quando possível e plante árvores.', 'As árvores absorvem gás carbônico, um dos principais gases do efeito estufa.'],
    15: ['Vida Terrestre', '#56C02B', 'Proteger, recuperar e promover o uso sustentável dos ecossistemas terrestres.', 'Combater o desmatamento e proteger as margens do rio preserva animais e plantas.', 'Não derrube árvores sem necessidade e denuncie queimadas ou desmatamento ilegal.', 'As florestas abrigam a maior parte da biodiversidade terrestre do planeta.'],
    16: ['Paz, Justiça e Instituições Eficazes', '#00689D', 'Promover sociedades pacíficas e inclusivas, com justiça e instituições eficazes.', 'Propor melhorias à prefeitura e cobrar iluminação e placas fortalece a cidadania.', 'Participe de conselhos de bairro e audiências públicas e acompanhe as obras da sua região.', 'Conselhos e audiências públicas são canais reais para a população opinar sobre a cidade.'],
    17: ['Parcerias e Meios de Implementação', '#19486A', 'Fortalecer parcerias para alcançar os objetivos de desenvolvimento sustentável.', 'Unir moradores, escola e prefeitura nas ações mostra que os objetivos são alcançados em conjunto.', 'Forme grupos com vizinhos, escolas e associações para resolver problemas comuns.', 'Os ODS dependem de parcerias entre governos, empresas e sociedade civil.']
  };

  // Personagens que dão missões (andam pelos caminhos)
  const GIV = [
    { p: 1, x: 5, y: 21, tool: 'can', n: 'Dona Rosa', c: '#e05a8a', in: ['Olá, treinador! Nosso bairro está cheio de sacos de lixo no chão.', 'Pegue os 3 sacos de lixo nos pontos amarelos (!). Fique perto e aperte E.', 'Cuidado: o último saco guarda uma surpresa! Leve seu PokRecycling.'], dn: ['Obrigada por cuidar do nosso bairro!'] },
    { p: 2, x: 32, y: 13, n: 'Prof. Lucas', c: '#3d7bd9', in: ['A escola precisa ser um lugar de respeito para todos.', 'Observe o recreio, a rampa e as turmas. Use E para investigar.', 'Cuidado: o último ponto traz uma surpresa. Leve seu PokRecycling!'], dn: ['Nossa escola ficou mais acolhedora. Obrigado!'] },
    { p: 3, x: 13, y: 21, tool: 'domino', n: 'Seu Antônio', c: '#8e6c3b', in: ['Essas ruas estão perigosas à noite.', 'Descubra o que falta na iluminação, nas calçadas e nas placas.'], dn: ['Agora a rua está mais segura para todos.'] },
    { p: 4, x: 18, y: 17, n: 'Marta', c: '#9c4dcc', in: ['Muitos vizinhos vivem sozinhos e precisam de apoio.', 'Investigue as famílias e os vizinhos isolados.'], dn: ['Nosso bairro agora se ajuda de verdade.'] },
    { p: 5, x: 22, y: 22, tool: 'sprout', n: 'Bia', c: '#2e9e5b', in: ['O rio está sujo e as árvores estão sumindo.', 'Examine os problemas da natureza e proteja o nosso verde.'], dn: ['O rio agradece! Obrigada, treinador.'] },
    { p: 0, quiz: 1, x: 31, y: 21, n: 'Seu Zé', c: '#2a9d8f', in: [], dn: [] }
  ];
  // Problemas investigáveis (x, y, título, descrição)
  const PROB = [

    if (dist > JOY_R) { dx = dx / dist * JOY_R; dy = dy / dist * JOY_R; }
    knobEl.style.transform = `translate(${dx}px, ${dy}px)`;
    const nx = dx / JOY_R, ny = dy / JOY_R;
    joyVec = Math.hypot(nx, ny) < DEAD ? { x: 0, y: 0 } : { x: nx, y: ny };
  }
  function joyReset() { joyId = null; joyVec = { x: 0, y: 0 }; knobEl.style.transform = 'translate(0px, 0px)'; knobEl.classList.remove('active'); }
  joyEl.addEventListener('pointerdown', e => {
    e.preventDefault(); joyId = e.pointerId;
    const r = joyEl.getBoundingClientRect();
    joyCenter = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    joyEl.setPointerCapture(e.pointerId); knobEl.classList.add('active');
    joyCalc(e.clientX, e.clientY);
  });
  joyEl.addEventListener('pointermove', e => { if (e.pointerId === joyId) joyCalc(e.clientX, e.clientY); });
  const joyEnd = e => { if (e.pointerId === joyId) joyReset(); };
  joyEl.addEventListener('pointerup', joyEnd);
  joyEl.addEventListener('pointercancel', joyEnd);
  joyEl.addEventListener('lostpointercapture', joyEnd);

  $('bA').addEventListener('pointerdown', e => { e.preventDefault(); dialog ? advance() : interact('talk'); });
  $('bE').addEventListener('pointerdown', e => { e.preventDefault(); if (!busy()) interact('examine'); });
  $('bM').addEventListener('pointerdown', e => { e.preventDefault(); if (!busy()) openMap(); });
  $('bI').addEventListener('pointerdown', e => { e.preventDefault(); if (!busy()) openMenu('inventario'); });

  // ---------- Colisão e movimento ----------
  function walkable(x, y) {
    if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return false;
    return !SOLID.has(map[y][x]) && !AMB.some(n => (n.a || 1) === area && n.x === x && n.y === y);
  }
  // Colisão por caixa nos pés: o personagem não atravessa árvores, casas, água etc.
  const npcAt = (x, y) => AMB.some(n => (n.a || 1) === area && n.x === x && n.y === y);
  const terrainOk = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS && !SOLID.has(map[y][x]);
  const boxTiles = (x, y) => [[-0.3, 0.1], [0.3, 0.1], [-0.3, 0.35], [0.3, 0.35]].map(o => [Math.round(x + o[0]), Math.round(y + o[1])]);
  function hits(x, y) {
    const t = boxTiles(x, y);
    if (t.some(c => !terrainOk(c[0], c[1]))) return true;
    // se já está encostado em um NPC, deixa o jogador sair (nunca fica preso)
    if (boxTiles(player.px, player.py).some(c => npcAt(c[0], c[1]))) return false;
    return t.some(c => npcAt(c[0], c[1]));
  }
  // Movimento livre e suave: cada eixo é testado separadamente, então o personagem desliza junto das paredes
  function moveFree(dist, vx, vy) {
    const nx = player.px + vx * dist;
    if (!hits(nx, player.py)) player.px = nx;
    const ny = player.py + vy * dist;
    if (!hits(player.px, ny)) player.py = ny;
  }
  function frontTile() { const [dx, dy] = DIRS[player.dir]; return [Math.round(player.px + dx * 0.75), Math.round(player.py + dy * 0.75)]; }
  const at = (arr, x, y) => arr.find(o => o.x === x && o.y === y && (o.a || 1) === area);

  // ---------- Interações ----------
  function say(name, color, lines) { dialog = { name, color, lines, i: 0, t0: performance.now(), done: false }; sfx('talk'); }

  // Mensagens de orientação e aviso de missão pendente
  let flash = '', flashT = 0;
  function warn(p) {
    const a = activePhase();
    flash = a ? `⚠ Você já tem uma missão pendente: Fase ${a} – ${PH[a - 1].n}. Conclua-a antes da Fase ${p}.` : '';
    flashT = performance.now() + 3500;
  }
  function goalText() {
    const a = activePhase();
    if (!a && !S.a2.done) return area === 2 ? (S.a2.intro ? `Praça Central: examine as 3 tarefas com E (${S.a2.found.length}/3) e volte para a Dona Luzia.` : 'Praça Central: fale com a Dona Luzia.') : '🌀 Nova área: entre no portal lilás a leste da vila.';
    if (!a) {
      if (phase6Ready() && !S.phase6.bossWon) {
        const c = S.phase6.challenges.length;
        return c < 3 ? `🌌 Fase 6: examine os pontos roxos com E (${c}/3).` : '🌌 Fase 6: enfrente Obscurion no ponto vermelho do cruzamento.';
      }
      return '🎉 Todas as missões foram concluídas!';
    }
    const ph = PH[a - 1], g = GIV.find(x => x.p === a), ex = examinedCount(a);
    if (!S.intro[a]) return `Missão atual · Fase ${a} – ${ph.n}: fale com ${g.n} (Espaço).`;
    if (ex < 3) return `Missão atual · Fase ${a}: investigue os problemas com E (${ex}/3).`;
    return `Missão atual · Fase ${a}: volte para ${g.n} e escolha um plano de ação.`;
  }
  let lastGoal = null;
  function updateGoal() {
    const el = $('goal');
    const warnOn = flash && performance.now() < flashT;
    const text = warnOn ? flash : goalText();
    const cls = warnOn ? 'warn' : '';
    if (lastGoal === text + cls) return;
    lastGoal = text + cls;
    el.textContent = text;
    el.className = cls;
    el.style.display = text ? 'block' : 'none';
  }
  function advance() {
    if (!dialog) return;
    if (!dialog.done) { dialog.t0 = -1e9; return; }
    dialog.i++; dialog.t0 = performance.now(); dialog.done = false;
    if (dialog.i >= dialog.lines.length) { dialog = null; if (afterDialog) { const f = afterDialog; afterDialog = null; f(); } }
  }

  function interact(kind) {
    const spots = [frontTile(), [player.x, player.y]];
    if (kind === 'examine') {
      for (const [x, y] of spots) { const q2 = at(A2D, x, y); if (q2) return examineA2(q2); }
      for (const [x, y] of spots) { const q6 = at(P6D, x, y); if (q6) return examine6(q6); }
      for (const [x, y] of spots) { const hd = at(HID, x, y); if (hd) return findHidden(hd); }
      for (const [x, y] of spots) { const pr = at(PROB, x, y); if (pr) return examine(pr); }
      return say('Dica', '#8bc34a', ['Procure os pontos amarelos (!) da vila. Fique na frente deles e pressione E.']);
    }
    for (const [x, y] of spots) { const n = at(AMB, x, y); if (n) return talkAmb(n); }
    for (const [x, y] of spots) { const g = at(GIV, x, y); if (g) return talk(g); }
  }

  function examine(pr) {
    const id = PROB.indexOf(pr);
    if (S.done.includes(pr.p)) return say(pr.t, '#4caf50', ['Este problema já foi resolvido. ✅']);
    if (activePhase() !== pr.p) return warn(pr.p);
    if (!S.intro[pr.p]) { const gv = GIV.find(x => x.p === pr.p); return say('Aviso', '#ffb74d', [`Fale primeiro com ${gv ? gv.n : 'o morador'} para saber o que fazer aqui.`]); }
    S.exam[pr.p] = S.exam[pr.p] || [];
    if (S.exam[pr.p].includes(id)) return say(pr.t, '#ffd54f', ['Você já investigou este problema.']);
    if (ENEMIES[pr.p] && examinedCount(pr.p) === 2) return startTrashBattle(pr, id);
    S.exam[pr.p].push(id); addPts(10);
    const lines = [pr.d, `+10 pontos. Investigados: ${examinedCount(pr.p)}/3.`];
    const pk = activePk();
    S.friend = S.friend || {}; S.friend[pk] = Math.min(5, (S.friend[pk] || 0) + 0.5);
    if (pk === BEST[pr.p]) { addPts(5); lines.push(`${PARTNERS[pk][0]} usou ${PARTNERS[pk][1]}! +5 pontos de bônus.`); }
    save(); say(pr.t, '#ffd54f', lines);
  }

  function talk(g) {
    if (g.a2) return talkLuzia();
    if (g.quiz) return startQuiz(0);
    if (S.done.includes(g.p)) return say(g.n, g.c, g.dn);
    if (activePhase() !== g.p) return warn(g.p);
    if (!S.intro[g.p]) { S.intro[g.p] = 1; save(); return say(g.n, g.c, g.in); }
    const ex = examinedCount(g.p);
    if (ex < 3) return say(g.n, g.c, [`Ainda faltam ${3 - ex} problema(s) para investigar. Continue explorando!`]);
    openSolutions(g.p);
  }

    const grp = (id, arr, fmt) => `<div class='opts' id='${id}' style='flex-direction:row;flex-wrap:wrap'>${arr.map((x, k) => `<button data-k='${k}' class='${k === 0 ? 'sel' : ''}'>${esc(fmt(x))}</button>`).join('')}</div>`;
    modal(`<h2>Crie seu treinador</h2>
      <p>Nome: <input id='hn' maxlength='12' placeholder='Treinador' style='font:inherit;padding:6px;border-radius:6px;border:2px solid #999'></p>

      <div class="opts">${ph.sol.map((s, i) => `<button data-s="${i}">${esc(s[0])}</button>`).join('')}</div>

  function completeMission(p, i) {

    addPts(pts + 200);
    lastFb = (tier === 'b' ? 'Ótima escolha! ' : 'Boa escolha! ') + `+${pts} pontos. Bônus de fase: +200 pontos.`;

    ph.ods.forEach(o => { if (!S.ods.includes(o)) S.ods.push(o); });
    S.done.push(p); save();

  function cardHTML(o) {

    $('send').onclick = () => {

  }

        <div class="after"><b>Depois</b><p>♻️ Ruas limpas e lixeiras<br>💡 Ruas iluminadas<br>♿ Escola acessível<br>🌳 Rio e praças protegidos</p></div>
      </div>

      <div class="row"><button id="fim">Fechar</button></div>`, 'card');

  const PHASE6_CHALLENGES = [
    { title: 'Ponte da Cooperação', text: 'A ponte precisa de madeira, cordas e ferramentas. Qual é o melhor plano?', opts: ['Cada pessoa guarda seus materiais.', 'Dividir tarefas e reunir os recursos com ajuda dos moradores.', 'Esperar que alguém resolva sozinho.'], answer: 1, why: 'Cooperar permite combinar habilidades e recursos para alcançar um objetivo comum.' },

  const BOSS_QUESTIONS = [

  function startPhase6() {

  function update(dt) {

      const v = inputVec();
      if (v.x || v.y) {
        if (Math.abs(v.x) > Math.abs(v.y)) player.dir = v.x > 0 ? 'right' : 'left';

      } else { player.moving = false; player.stepAnim = 0; }

    player.y = Math.round(player.py);

    updateAmb(dt);

  function drawGround(t, x, y, sx, sy) {
    if (t === 'r' || t === 'K' || t === 'm') {
      ctx.fillStyle = '#7fd35a'; ctx.fillRect(sx, sy, TS, TS);
      if (t === 'r') {
        ctx.fillStyle = '#2e7d32'; ctx.beginPath(); ctx.arc(sx + 20, sy + 24, 14, 0, 7); ctx.fill();
        [[10, 18], [22, 14], [28, 24], [16, 28], [24, 30], [12, 26]].forEach((p, i) => { ctx.fillStyle = i % 2 ? '#ff4081' : '#f48fb1'; ctx.fillRect(sx + p[0], sy + p[1] - 4, 5, 5); });
      } else if (t === 'm') {
        ctx.fillStyle = '#6d4c41'; ctx.fillRect(sx + 6, sy + 26, 28, 8);

  function drawGuide() {

  const DIRN = [[0, -1, 'up'], [0, 1, 'down'], [-1, 0, 'left'], [1, 0, 'right']];

  function updateAmb(dt) {

  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function wrapText(text, x, y, maxW, lh) {
    const words = text.split(' '); let line = '', yy = y;
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, yy); line = w; yy += lh; }
      else line = test;
    }
    if (line) ctx.fillText(line, x, yy);
  }
  function drawDialog() {
    const boxH = 150, bw = Math.min(VW - 24, 680), bx = (VW - bw) / 2;
    const by = (() => { const g = $('goal'); return g.style.display !== 'none' ? g.getBoundingClientRect().bottom + 10 : 12; })();
    ctx.fillStyle = 'rgba(14,26,20,.93)'; roundRect(bx, by, bw, boxH, 14); ctx.fill();
    ctx.strokeStyle = '#fff8e1'; ctx.lineWidth = 3; roundRect(bx + 3, by + 3, bw - 6, boxH - 6, 12); ctx.stroke();
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    if (dialog.name) {
      ctx.font = '700 16px "Pixelify Sans", monospace';
      const nw = ctx.measureText(dialog.name).width + 20;
      ctx.fillStyle = dialog.color; ctx.fillRect(bx + 16, by + 10, nw, 26);
      ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.fillText(dialog.name, bx + 26, by + 23);
      ctx.textBaseline = 'top';
    }
    ctx.fillStyle = '#fff8e1'; ctx.font = `500 ${Math.round(18 * CFG.text)}px "Pixelify Sans", monospace`;
    const full = dialog.lines[dialog.i], cnt = Math.floor((performance.now() - dialog.t0) * CFG.cps / 1000);
    dialog.done = cnt >= full.length;
    wrapText(full.slice(0, Math.max(0, cnt)), bx + 16, by + (dialog.name ? 46 : 20), bw - 32, Math.round(26 * CFG.text));
    if (dialog.done && Math.floor(time / 300) % 2) { ctx.fillStyle = '#ffd54f'; ctx.fillText('▼', bx + bw - 30, by + boxH - 30); }
  }

  // ---------- Loop ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(64, now - last); last = now;
    try { update(dt); render(); } catch (err) { console.error(err); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  if (S.pos && (S.pos.area !== 2 || S.done.length >= 5)) {
    area = S.pos.area === 2 ? 2 : 1; map = area === 2 ? map2 : map1;
    if (walkable(S.pos.x, S.pos.y) && map[S.pos.y][S.pos.x] !== 'X') { player.x = player.px = S.pos.x; player.y = player.py = S.pos.y; }
  }
  const savePos = () => { S.pos = { x: Math.round(player.px), y: Math.round(player.py), area }; save(); };
  setInterval(() => { if (!busy()) savePos(); }, 2500);
  addEventListener('pagehide', savePos);
  document.addEventListener('visibilitychange', () => { if (document.hidden) savePos(); });
  if (!S.hero && (S.done.length || S.points)) S.hero = hero();
  checkPhase6Unlock();
  openMenu('jogar');
  if (!CFG.device) askDevice();
})();
</script>
